# MOTIQ hardware setup = the hardware requirements document of the arm cell.
# Change it here (then run: python -m robot_chooser apply) or in the UI (python -m robot_chooser serve).
# Everything above the `requirements:` block is input; that block is regenerated on every apply.
# Units: m, rad, kg (deg only where the key says so). Simulation only: no physical robot is ever selected.
schema: motiq_hardware/2

active_robot: ur_ur5e                       # one id from catalog.yaml
backend: mock                               # mock (no RoboDK) | robodk_sim (RoboDK, RUNMODE_SIMULATE)
speed_percent: 10.0                         # % of the ACTIVE robot's verified maximums

mounting:
  orientation: upright                      # upright | wall | ceiling
  base_in_world_m: [0.0, 0.0, 0.0]          # robot base in the cell frame
  base_yaw_deg: 0.0
  table_surface_z_m: 0.0
  status: assumed                           # assumed | measured

# Every device in the cell, one entry each. type = a file in hardware_types/ (fields, units, drivers).
# attached_to: cell | arm | <component id> (chains: arm -> tool_changer -> gripper -> camera).
# Everything carried by the arm counts against its payload; the end effector sets the TCP.
# status: placeholder | datasheet | measured. driver: how it is connected (see its type file).
components:
  - id: main_tool
    type: gripper
    name: Custom 3D-printed plastic gripper (fixed, non-actuated)
    attached_to: arm
    driver: controller_symbolic
    status: placeholder
    notes: Rigid plastic tool, no hardware specs; mass and length still to be measured.
    spec:
      kind: rigid
      actuated: false
      mass_kg: 1.0
      tcp_offset_m_rad: [0.0, 0.0, 0.15, 0.0, 0.0, 0.0]
      sim_gripper: symbolic
  - id: realsense_d415
    type: camera
    name: Intel RealSense D415
    attached_to: cell
    driver: realsense
    status: placeholder
    notes: null
    spec:
      role: vision
      serial: '143122062854'
      calibrated: false
      model: D415
  - id: realsense_d435
    type: camera
    name: Intel RealSense D435
    attached_to: cell
    driver: null
    status: placeholder
    notes: null
    spec:
      role: skill_recording
      calibrated: false
      model: D435

workspace_overrides:                        # per robot id; empty = catalog default_workspace
  {}

# --------------------------------------------------------------------------------------------------
# GENERATED by robot-chooser on apply - do not edit by hand.
# status READY = controller files generated and validated by robot_control; BLOCKED = they were not.
# --------------------------------------------------------------------------------------------------
requirements:
  robot_id: ur_ur5e
  robot: Universal Robots UR5e
  dof: 6
  backend: mock
  simulation_only: true
  status: READY
  label: Ready
  limits_verified: true
  config_complete: true
  blockers: []
  warnings:
  - level: warning
    code: GRIPPER
    message: 'the real tool (Custom 3D-printed plastic gripper (fixed, non-actuated)) does not open/close: grasp/release
      only work in simulation'
  - level: warning
    code: PLACEHOLDER
    message: 'Custom 3D-printed plastic gripper (fixed, non-actuated): values are placeholders - measure them or take
      them from the datasheet, then set status'
  - level: warning
    code: PLACEHOLDER
    message: 'Intel RealSense D415: values are placeholders - measure them or take them from the datasheet, then set
      status'
  - level: warning
    code: CAMERA
    message: 'camera Intel RealSense D415 is not calibrated: its detections do not give executable pick coordinates'
  - level: warning
    code: PLACEHOLDER
    message: 'Intel RealSense D435: values are placeholders - measure them or take them from the datasheet, then set
      status'
  - level: warning
    code: CAMERA
    message: 'camera Intel RealSense D435 is not calibrated: its detections do not give executable pick coordinates'
  notes:
  - level: info
    code: GRIPPER
    message: 'symbolic gripper: grasps are simulated, never a physical grip confirmation'
  - level: info
    code: MOUNTING
    message: robot base pose in the cell is assumed, not measured
  model_file_ok: true
  payload_budget_kg: 4.0
  carried_mass_kg: 1.0
  reach_m: 0.85
  tcp_length_m: 0.15
  end_effector: main_tool
  components:
  - id: main_tool
    type: gripper
    name: Custom 3D-printed plastic gripper (fixed, non-actuated)
    attached_to: arm
    carried_by_arm: true
    driver: controller_symbolic
    connection: simulated via robot_controller (mock / robodk_sim backends)
    status: placeholder
  - id: realsense_d415
    type: camera
    name: Intel RealSense D415
    attached_to: cell
    carried_by_arm: false
    driver: realsense
    connection: physical, read-only via computer-vision server
    status: placeholder
  - id: realsense_d435
    type: camera
    name: Intel RealSense D435
    attached_to: cell
    carried_by_arm: false
    driver: null
    connection: documented only (no driver)
    status: placeholder
  workspace:
    frame_id: base
    x_m: [-0.7, -0.2]
    y_m: [-0.4, 0.4]
    z_m: [0.015, 0.55]
  selection_version: 22
  generated_files: [robot_controller/config/robot.yaml, robot_controller/config/safety.yaml, robot_controller/config/scene.yaml]
  generated_at: '2026-11-05T09:40:05+00:00'
