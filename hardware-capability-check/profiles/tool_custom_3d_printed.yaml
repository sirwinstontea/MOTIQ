# End-of-arm tool profile: custom 3D-printed plastic gripper (as described by the project owner)
#
# Owner statement (2026-11-04): "The gripper is a custom gripper 3D printed (plastic), so no hardware
# specs / it doesn't move, it's just attached to the arm."
# => rigid, NOT actuated. Everything not stated is `null` (= unknown -> the checker asks for it or
# reports it as a condition; it never invents a value).
#
# Fill in the nulls as soon as they are measured. A real actuated gripper profile can use the same
# fields (see `actuation`), e.g. opening_max_m / grip_force_n for a Robotiq 2F-85.
schema: tool_profile/1

tool:
  id: custom_3d_printed_gripper
  name: Custom 3D-printed plastic gripper (fixed, non-actuated)
  source: owner_statement
  material: plastic (3D printed)

  actuation:
    actuated: false            # does not move
    kind: none                 # none | parallel | angular | vacuum | magnetic | other
    opening_max_m: null
    opening_min_m: null
    grip_force_n: null
    stroke_time_s: null
    control_interface: null    # e.g. tool_digital_output | rs485 | tool_analog

  # Interaction modes that a RIGID tool can physically provide through its shape alone.
  # Allowed values: scoop, hook, push, press_fit, cradle, magnetic_passive
  # Leave empty until the shape is known: then grasping/holding an object is NOT possible.
  passive_modes: []

  mass_kg: null                # unknown -> payload check reports the allowed budget instead
  cog_offset_from_flange_m: null   # distance flange centre -> tool CoG along the tool z axis
  tcp_offset_m: null           # distance flange centre -> contact point (TCP) along the tool z axis
  tcp_offset_search_m: [0.05, 0.30]   # range the checker scans while the real length is unknown
  envelope:                    # bounding box of the tool in the flange frame (for clearance checks)
    radius_m: null
    length_m: null
  mounting:
    flange: EN ISO 9409-1-50-4-M6
    status: assumed            # not stated by the owner; required by the UR5e flange
  power_draw: null
