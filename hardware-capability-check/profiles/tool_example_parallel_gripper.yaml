# ILLUSTRATIVE tool profile - NOT the project's real gripper.
# Use it for "what if we had an actuated gripper" runs:
#     python -m hardware_capability_check skill.json --tool tool_example_parallel_gripper.yaml
# All numbers below are placeholders chosen for the what-if run; replace them with the datasheet of the real tool
# (for a commercial gripper, copy its opening range / force / mass / length from its manual).
schema: tool_profile/1

tool:
  id: example_parallel_gripper
  name: Example parallel gripper (illustrative values)
  source: placeholder
  material: n/a

  actuation:
    actuated: true
    kind: parallel
    opening_max_m: 0.085
    opening_min_m: 0.0
    grip_force_n: 40.0
    stroke_time_s: null
    control_interface: tool_digital_output

  passive_modes: []
  mass_kg: 0.9
  cog_offset_from_flange_m: 0.05
  tcp_offset_m: 0.16
  tcp_offset_search_m: [0.05, 0.30]
  envelope:
    radius_m: 0.04
    length_m: 0.16
  mounting:
    flange: EN ISO 9409-1-50-4-M6
    status: assumed
  power_draw: null
