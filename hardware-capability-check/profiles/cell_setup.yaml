# Work-cell setup: where the arm stands and the defaults used to turn a task into motions.
#
# `status: assumed` values are NOT facts. Every result that depends on them is reported as a
# condition ("holds if cell.robot_base_in_world is confirmed"). Change them here and re-run.
schema: cell_profile/1

cell:
  name: tabletop cell (UR5e on table)

  robot_base_in_world:           # pose of the UR base frame in the skill's "world" frame
    position_m: [0.0, 0.0, 0.0]
    yaw_deg: 0.0
    status: assumed              # the example skill puts objects at x=0.30..0.55 m, z=0.02 m on a table at z=0
    note: Skill coordinates are used as base coordinates unless this pose says otherwise.
  mounting:
    orientation: upright         # upright | wall | ceiling   (only upright is modelled for gravity/table checks)
    status: assumed
  table:
    surface_z_m: 0.0             # world z of the table top
    status: assumed              # skill says surface "table"; objects have z>=0
  reachability_margin_m: 0.02    # keep this far inside the kinematic limit (calibration, tool uncertainty)

  # Defaults used to expand PICK / PLACE / MOVE into waypoints. Not facts: motion-planning choices.
  motion_defaults:
    approach_clearance_m: 0.10     # hover height above a pick/place point
    retreat_clearance_m: 0.10
    transit_clearance_m: 0.05      # extra height when carrying an object over obstacles/containers
    path_sample_step_m: 0.025      # Cartesian sampling of straight-line segments
    max_joint_step_rad: 0.45       # largest joint change between two samples before a branch flip is assumed
    max_wrist_joint_step_rad: 0.9
    singularity_inv_condition_warn: 0.02   # sigma_min/sigma_max below this -> warning, 3x lower -> failure
    default_yaw_candidates_deg: [0, 90, 180, 270, 45, 135, 225, 315]

  # Used when the skill does not state a size and nothing can be inferred. Scanned, not trusted.
  unknown_dimension_scan:
    container_wall_height_m: [0.05, 0.10, 0.15, 0.20]
    object_size_m: [0.03, 0.05, 0.08]
