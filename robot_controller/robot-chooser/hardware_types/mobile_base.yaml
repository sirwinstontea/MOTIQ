# Mobile base in the cell. Documented here; it is not driven by the arm controller.
type: mobile_base
label: Mobile robot / base
description: Legged or wheeled base in the cell. Not part of the arm's kinematic chain.
attach_to: [cell]
roles: [mobility]
payload_field: null
fields:
  kind: {type: enum, values: [legged, wheeled, tracked, other], required: true}
  model: {type: string}
  payload_kg: {type: number, min: 0, unit: kg}
  max_speed_m_s: {type: number, min: 0, unit: m/s}
  battery_wh: {type: number, min: 0, unit: Wh}
drivers:
  - id: external
    description: mobile base driven by its own controller, not by this arm stack
    connects_via: its own controller
    physical: true
    actuates: true
