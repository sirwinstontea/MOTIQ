[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-control"
version = "0.1.0"
description = "Robot-agnostic manipulation controller (Mock and PyBullet simulation only)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6",
  "numpy>=1.24",
  "pybullet>=3.2.6",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "numpy>=1.24", "trimesh>=4"]
# Demo simulation objects (objects/, robot_control/sim_objects).
objects = ["numpy>=1.24", "trimesh>=4"]

[tool.setuptools.packages.find]
include = ["robot_control*"]

[tool.setuptools.package-data]
"robot_control.api" = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs URSim; opt in with RUN_URSIM_TESTS=1"]
addopts = "-m 'not integration'"
