# SIM=1 demo config (run_all.sh / start_stack.sh): the UR5e cell in PyBullet.
# Loaded explicitly with --config, so the chooser selection is not used in SIM=1.
model: UR5e
dof: 6
backend: pybullet
station_name: UR5e Controller Demo
station_path: stations/UR5e_demo.rdk
robot_library_file: stations/UR5e.robot
robot_item_name: UR5e
base_frame: UR5e Base
tool_frame: Gripper TCP
gripper_kind: symbolic
tcp_offset_m_rad: [0.0, 0.0, 0.15, 0.0, 0.0, 0.0]
tool_mass_kg: 1.0
limits:
  source: UR5e e-Series datasheet (payload 5 kg, reach 850 mm, joint speed 180 deg/s, TCP 1 m/s); elbow limited
    to +/-pi as in ROS ur_description; accel caps are configured demo values, not datasheet
  joint_min_rad: [-6.2832, -6.2832, -3.1416, -6.2832, -6.2832, -6.2832]
  joint_max_rad: [6.2832, 6.2832, 3.1416, 6.2832, 6.2832, 6.2832]
  max_joint_speed_rad_s: [3.1416, 3.1416, 3.1416, 3.1416, 3.1416, 3.1416]
  max_joint_accel_rad_s2: 4.0
  max_tcp_speed_m_s: 1.0
  max_tcp_accel_m_s2: 2.0
  max_payload_kg: 5.0
  reach_m: 0.85
capabilities: [named_targets, path_check, symbolic_gripper]
