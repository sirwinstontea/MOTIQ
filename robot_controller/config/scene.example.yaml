# Allowlisted scene for the UR5e demo cell: the 4 real demo objects (no red cube).
# Units: m, rad (rotation vector).
# Frame: robot base. This UR5e model faces -X at its home pose, so the work
# area is at negative X. Tool-down orientation = rotation vector [pi, 0, 0].
# Targets here are "taught" into the RoboDK demo station by `setup-station`;
# on a real cell they must be re-taught with the teach pendant.
home_target: home

targets:
  home:
    joints_rad: [0.0, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
    pose_m_rad: [-0.49195, -0.1333, 0.3379, 2.2214, 2.2214, 0.0]   # expected TCP (FK), used by mock
    description: safe home posture
  shake_center:    {pose_m_rad: [-0.45,  0.00, 0.300, 3.14159, 0, 0]}
  shake_left:      {pose_m_rad: [-0.45,  0.04, 0.300, 3.14159, 0, 0]}
  shake_right:     {pose_m_rad: [-0.45, -0.04, 0.300, 3.14159, 0, 0]}
  delivery_approach: {pose_m_rad: [-0.45, 0.20, 0.150, 3.14159, 0, 0]}
  delivery_place:    {pose_m_rad: [-0.45, 0.20, 0.028, 3.14159, 0, 0]}
  delivery_retreat:  {pose_m_rad: [-0.45, 0.20, 0.200, 3.14159, 0, 0]}

  # --- Arm camera (mounted on the arm head, looking down along the tool). Look poses for searching the table:
  # high enough that the camera sees a wide strip of the table. Named targets only, same checks as any move.
  scan_right:    {pose_m_rad: [-0.55, -0.20, 0.400, 3.14159, 0, 0]}
  scan_center:   {pose_m_rad: [-0.55,  0.00, 0.400, 3.14159, 0, 0]}
  scan_left:     {pose_m_rad: [-0.55,  0.20, 0.400, 3.14159, 0, 0]}
  scan_delivery: {pose_m_rad: [-0.45,  0.20, 0.300, 3.14159, 0, 0]}

  # --- Drop INTO the blue bucket (139 mm wide, 115 mm tall): held object released above the rim.
  # place z = rim 0.115 + half a 90 mm screw below the TCP + 30 mm margin. Simulation placeholder: re-teach on a real cell.
  blue_bucket_01_above:  {pose_m_rad: [-0.62, -0.24, 0.300, 3.14159, 0, 0]}
  blue_bucket_01_drop:   {pose_m_rad: [-0.62, -0.24, 0.190, 3.14159, 0, 0]}

  # --- Demo objects (objects/, imported by scripts/import_all.py). SIMULATION PLACEHOLDERS:
  # positions = display layout in object_specifications.json (Objects_Frame at base [-620,0,0], rz=90).
  # Grasp = tool-down on the symmetry axis at the object's mid-height (symbolic gripper rule).
  # NOT taught on a real cell and no real gripper/jaw geometry: re-teach before any real use.
  blue_bucket_01_approach: {pose_m_rad: [-0.62, -0.24, 0.250, 3.14159, 0, 0]}
  blue_bucket_01_grasp:    {pose_m_rad: [-0.62, -0.24, 0.0575, 3.14159, 0, 0]}
  blue_bucket_01_lift:     {pose_m_rad: [-0.62, -0.24, 0.300, 3.14159, 0, 0]}
  green_ring_02_approach: {pose_m_rad: [-0.62, -0.07, 0.250, 3.14159, 0, 0]}
  green_ring_02_grasp:    {pose_m_rad: [-0.62, -0.07, 0.0150, 3.14159, 0, 0]}
  green_ring_02_lift:     {pose_m_rad: [-0.62, -0.07, 0.300, 3.14159, 0, 0]}
  orange_screw_03_approach: {pose_m_rad: [-0.62, +0.08, 0.250, 3.14159, 0, 0]}
  orange_screw_03_grasp:    {pose_m_rad: [-0.62, +0.08, 0.0450, 3.14159, 0, 0]}
  orange_screw_03_lift:     {pose_m_rad: [-0.62, +0.08, 0.300, 3.14159, 0, 0]}
  white_bucket_lid_04_approach: {pose_m_rad: [-0.62, +0.24, 0.250, 3.14159, 0, 0]}
  white_bucket_lid_04_grasp:    {pose_m_rad: [-0.62, +0.24, 0.0265, 3.14159, 0, 0]}
  white_bucket_lid_04_lift:     {pose_m_rad: [-0.62, +0.24, 0.300, 3.14159, 0, 0]}

objects:
  blue_bucket_01:   # 139x139x115 mm cup; grasp height = mid-height
    dimensions_m: [0.139, 0.139, 0.115]
    # mass_kg: unknown -> shake is refused until a measured mass is added
    approach_target: blue_bucket_01_approach
    grasp_target: blue_bucket_01_grasp
    lift_target: blue_bucket_01_lift
    class_labels: [secchio_blu, secchio, blue bucket, bucket, Blue_Bucket_01]   # vision model classes first
    station_item: Blue_Bucket_01
  green_ring_02:   # 139x139x7 mm ring; grasp at workspace floor z=15 mm (ring centre z=3.5 mm)
    dimensions_m: [0.139, 0.139, 0.007]
    # mass_kg: unknown -> shake is refused until a measured mass is added
    approach_target: green_ring_02_approach
    grasp_target: green_ring_02_grasp
    lift_target: green_ring_02_lift
    class_labels: [anello_verde, anello, green ring, ring, Green_Ring_02]   # vision model classes first
    station_item: Green_Ring_02
  orange_screw_03:   # 30x30x90 mm screw; grasp height = mid-height
    dimensions_m: [0.030, 0.030, 0.090]
    # mass_kg: unknown -> shake is refused until a measured mass is added
    approach_target: orange_screw_03_approach
    grasp_target: orange_screw_03_grasp
    lift_target: orange_screw_03_lift
    class_labels: [vite_arancione, vite arancione, vite, orange screw, screw, Orange_Screw_03]   # vision model classes first
    station_item: Orange_Screw_03
  white_bucket_lid_04:   # 139x139x53 mm lid; grasp height = mid-height
    dimensions_m: [0.139, 0.139, 0.053]
    # mass_kg: unknown -> shake is refused until a measured mass is added
    approach_target: white_bucket_lid_04_approach
    grasp_target: white_bucket_lid_04_grasp
    lift_target: white_bucket_lid_04_lift
    class_labels: [tappo_bianco, tappo, white lid, white bucket lid, bucket lid, lid, White_Bucket_Lid_04]   # vision model classes first
    station_item: White_Bucket_Lid_04

destinations:
  blue_bucket_01_inside:    # drop the held object into the blue bucket (where the bucket's slot is)
    approach_target: blue_bucket_01_above
    place_target: blue_bucket_01_drop
    retreat_target: blue_bucket_01_above
  delivery_zone:
    approach_target: delivery_approach
    place_target: delivery_place
    retreat_target: delivery_retreat
  blue_bucket_01_slot:      # the object's own spot: place it back where it was picked
    approach_target: blue_bucket_01_approach
    place_target: blue_bucket_01_grasp
    retreat_target: blue_bucket_01_approach
  green_ring_02_slot:      # the object's own spot: place it back where it was picked
    approach_target: green_ring_02_approach
    place_target: green_ring_02_grasp
    retreat_target: green_ring_02_approach
  orange_screw_03_slot:      # the object's own spot: place it back where it was picked
    approach_target: orange_screw_03_approach
    place_target: orange_screw_03_grasp
    retreat_target: orange_screw_03_approach
  white_bucket_lid_04_slot:      # the object's own spot: place it back where it was picked
    approach_target: white_bucket_lid_04_approach
    place_target: white_bucket_lid_04_grasp
    retreat_target: white_bucket_lid_04_approach

patterns:
  gentle_shake:
    description: "+/-40 mm side-to-side at 0.30 m height, linear moves at configured speed"
    max_cycles: 3
    requires_grip: true
    max_payload_kg: 0.5
    start_target: shake_center
    cycle_targets: [shake_left, shake_right]
    end_target: shake_center

# Camera on the arm head: before a pick the bridge first looks straight down at the object's slot
# (its approach target), then visits scan_targets in order until the camera sees the object.
search:
  camera: arm_mounted
  scan_targets: [scan_center, scan_right, scan_left, scan_delivery]
  look_first: object_approach
  settle_s: 0.6
  look_s: 1.5
  description: "eye-in-hand search over the demo table"

motions:
  go_home:
    targets: [home]
    description: return to home posture

# DEMO station geometry (RoboDK only). A stand-in for the real cell.
station_geometry:
  table:
    size_m: [0.50, 0.80, 0.02]
    pose_m_rad: [-0.45, 0.0, -0.02, 0, 0, 0]
    color: [0.55, 0.40, 0.25, 1.0]
  delivery_pad:
    size_m: [0.12, 0.12, 0.003]
    pose_m_rad: [-0.45, 0.20, 0.0, 0, 0, 0]
    color: [0.20, 0.70, 0.30, 1.0]
    no_collision_with: [table]
