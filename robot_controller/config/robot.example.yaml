# Robot model + backend selection. Copy to config/robot.yaml and adjust.
# Switch model by pointing the CLI at another file (e.g. robot.ur3e.example.yaml);
# no code changes are needed. Units: m, rad, kg.
model: UR5e
dof: 6
backend: mock                    # mock | pybullet | physical_disabled (motion refused)
station_name: UR5e Controller Demo
station_path: stations/UR5e_demo.rdk
robot_library_file: stations/UR5e.robot   # from https://www.universal-robots.com/products/ur5e/
robot_item_name: UR5e
base_frame: UR5e Base
tool_frame: Gripper TCP
gripper_kind: symbolic           # no real gripper modelled; feedback is "simulated"
tcp_offset_m_rad: [0, 0, 0.15, 0, 0, 0]   # placeholder TCP until a real gripper is measured
tool_mass_kg: 1.0                # placeholder; set from the real gripper datasheet
limits:
  source: "UR5e e-Series datasheet (payload 5 kg, reach 850 mm, joint speed 180 deg/s, TCP 1 m/s); elbow limited to +/-pi as in ROS ur_description; accel caps are configured values, not datasheet"
  joint_min_rad: [-6.2832, -6.2832, -3.1416, -6.2832, -6.2832, -6.2832]
  joint_max_rad: [ 6.2832,  6.2832,  3.1416,  6.2832,  6.2832,  6.2832]
  max_joint_speed_rad_s: [3.1416, 3.1416, 3.1416, 3.1416, 3.1416, 3.1416]
  max_joint_accel_rad_s2: 4.0
  max_tcp_speed_m_s: 1.0
  max_tcp_accel_m_s2: 2.0
  max_payload_kg: 5.0
  reach_m: 0.85
capabilities: [named_targets, symbolic_gripper, path_check]
