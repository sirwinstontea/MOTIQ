# URSim e-Series: the real UR controller software (PolyScope + RTDE/dashboard),
# simulated, with NO hardware attached. Use it to develop/test a UR adapter
# before it ever talks to a real arm.
#
#   docker compose -f ursim/docker-compose.yml up -d
#   open http://127.0.0.1:6080/vnc.html     (PolyScope in the browser)
#   docker compose -f ursim/docker-compose.yml down
#
# All ports bind to 127.0.0.1 only.
services:
  ursim:
    image: universalrobots/ursim_e-series:latest
    container_name: ursim_ur5e
    environment:
      ROBOT_MODEL: UR5            # e-Series image -> UR5e
    ports:
      - "127.0.0.1:6080:6080"     # noVNC web view of PolyScope
      - "127.0.0.1:5900:5900"     # raw VNC
      - "127.0.0.1:29999:29999"   # dashboard server (power on, brake release, load/play)
      - "127.0.0.1:30001:30001"   # primary interface
      - "127.0.0.1:30002:30002"   # secondary interface
      - "127.0.0.1:30003:30003"   # real-time interface
      - "127.0.0.1:30004:30004"   # RTDE
    volumes:
      - ./programs:/ursim/programs   # .urp programs persist here
    restart: "no"
